[project]
name = "obd-engine"
version = "0.1.0"
description = "Automotive Intelligence engine: OBD/ECU log ingestion, analysis and reporting"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0",
  "duckdb>=1.0",
  "pydantic>=2.5",
  "charset-normalizer>=3.3",
  "defusedxml>=0.7",
  "matplotlib>=3.8",
  "reportlab>=4.0",
  "fastexcel>=0.11",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pyarrow>=15.0",
]

[dependency-groups]
dev = ["pypdf>=4", "pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
obd-engine = "obd_engine.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obd_engine"]

[tool.hatch.build.targets.wheel.force-include]
"../reference" = "obd_engine/_reference"
"../samples" = "obd_engine/_samples"

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["src", ".."]

[tool.ruff]
line-length = 110
