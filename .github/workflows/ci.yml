name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install engine
        run: cd engine && uv sync
      - name: Lint
        run: cd engine && uv run ruff check src ../tests ../tools --select E9,F
      - name: Tests (includes repo hygiene: versions match, skills exist)
        run: cd engine && uv run pytest ../tests -q

  install:
    # Clean-runner install path: setup builds the venv from the lockfile, doctor must pass.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: /obd setup
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/obd-data
        run: python scripts/obd.py setup
      - name: /obd doctor
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/obd-data
        run: |
          out="$(python scripts/obd.py doctor)"; echo "$out"
          echo "$out" | grep -q '"status": "ok"'
      - name: Launcher reports SETUP_REQUIRED without an environment
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/does-not-exist
        run: |
          set +e; out="$(python scripts/obd.py list --json)"; code=$?
          echo "$out"; test "$code" = 4 && echo "$out" | grep -q SETUP_REQUIRED
      - name: Bundled MCP server starts via .mcp.json (uv run) and lists tools
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/obd-data
        run: uv run --frozen --no-dev --project engine python scripts/mcp_smoke.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: pip-audit on the locked dependency set
        run: |
          cd engine
          uv export --frozen --no-dev --no-emit-project > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip
